name: ci

# Format, lint, type check, tests, build, the declaration check with TypeScript 6 and a dependency
# audit, on the Node version of .nvmrc. Actions are pinned by commit; the comment names the release
# the commit belongs to.

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-fund

      - name: Check formatting
        run: npm run format:check

      # Lint, type check and tests read sibling packages from source, so they run before the build.
      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Check the declarations with TypeScript 6
        run: npm run check:consumers

      - name: Audit dependencies
        run: npm audit --audit-level=high
